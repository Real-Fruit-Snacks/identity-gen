name: Browser checks

on:
  push:
    branches: [main]
  pull_request:

# Runners are pinned to ubuntu-24.04: setup-python has no build of the Python in .python-version (3.12.10)
# for Ubuntu 26.04, which ubuntu-latest now gives.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_page.py

  art:
    # The README deck is the page's own output for six seeds. Fail if docs/assets/deck-*.svg no longer match
    # what docs/art/make-deck.py draws from index.html: the script changed, or a seed now makes someone else.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r docs/art/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python docs/art/make-deck.py
      - run: git diff --exit-code -- docs/assets/deck-dark.svg docs/assets/deck-light.svg

  download:
    # The release's index.html: the page with its fonts and icon built in, opened from disk with no network.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps --only-shell chromium firefox
      - run: python tools/build-standalone.py
      - run: python tests/test_download.py dist/index.html --browsers chromium,firefox
