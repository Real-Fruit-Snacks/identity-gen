<!DOCTYPE html>
<!-- The GitHub social preview, 1280 x 640. Render from the repo root with killer-repo's card.mjs:
       node card.mjs docs/card.html --out docs/assets/social.png
     It shows the README deck's still frame (docs/assets/deck-dark.svg) beside the name. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 800; src: url(art/fonts/atkinson-hyperlegible-next-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 500; src: url(art/fonts/atkinson-hyperlegible-next-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible Mono"; font-weight: 600; src: url(art/fonts/atkinson-hyperlegible-mono-latin-600-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 640px; background: #0C0D10; overflow: hidden; }
  body { position: relative; }
  .deck { position: absolute; top: 0; left: 470px; height: 640px; width: auto;
          -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 170px, #000 360px); mask-image: linear-gradient(90deg, transparent 0, transparent 170px, #000 360px); }
  .words { position: absolute; left: 76px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  h1 { margin: 0; font: 800 104px/0.92 "Atkinson Hyperlegible Next", sans-serif; color: #E8E6E1; letter-spacing: -0.02em; }
  h1 span { color: #FF6A3D; }
  p { margin: 0; font: 500 33px/1.22 "Atkinson Hyperlegible Next", sans-serif; color: #8A8F99; max-width: 430px; }
  .tag { font: 600 17px/1 "Atkinson Hyperlegible Mono", monospace; letter-spacing: 0.16em; color: #FFC247; }
</style>
</head>
<body>
  <img class="deck" src="assets/deck-dark.svg" alt="">
  <div class="words">
    <h1>identity<span>-</span><br>gen</h1>
    <p>Offline generator for throwaway signup identities</p>
    <div class="tag">ONE HTML FILE · PRESS N</div>
  </div>
</body>
</html>
