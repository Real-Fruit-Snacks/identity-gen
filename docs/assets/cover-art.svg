<!-- identity-gen cover panel (layout v2): the identity card, laid out like the app.
     528x448, origin = panel top-left. Rendered by Real-Fruit-Snacks/rfs-brand tools/make-cover.py.
     The avatar is the app's Pixel style, 48x48, drawn at 4x with crisp pixels. Name and field
     values are the v1 cover's examples. Drawn for a 400px card: fewer fields, bigger type. -->
<rect width="528" height="448" fill="{surface}"/>
<image x="28" y="28" width="192" height="192" image-rendering="optimizeSpeed" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="28.5" y="28.5" width="191" height="191" fill="none" stroke="{line}"/>
<rfs-text font="mono-semibold" size="31" x="246" y="70" ls="-0.8" fill="{text}">Wendy Jordan</rfs-text>
<rect x="246" y="88" width="254" height="1.5" fill="{line}"/>
<rfs-text font="sans" size="20" x="246" y="120" fill="{amber}">Bartender in Knoxville</rfs-text>
<rfs-text font="mono" size="13" x="246" y="160" ls="1.1" fill="{mute}">BIRTHDATE</rfs-text>
<rfs-text font="mono" size="20" x="246" y="186" fill="{text}">07/14/1991</rfs-text>
<rfs-text font="mono" size="13" x="390" y="160" ls="1.1" fill="{mute}">PIN</rfs-text>
<rfs-text font="mono" size="20" x="390" y="186" fill="{text}">6021</rfs-text>
<rfs-text font="mono" size="13" x="246" y="214" ls="1.1" fill="{mute}">LOCATION</rfs-text>
<rfs-text font="mono" size="20" x="246" y="240" fill="{text}">Knoxville, TN</rfs-text>
<!-- account -->
<rect y="262" width="528" height="1.5" fill="{line}"/>
<rfs-text font="mono" size="13" x="28" y="294" ls="1.1" fill="{mute}">USERNAME</rfs-text>
<rfs-text font="mono" size="23" x="28" y="323" fill="{text}">wren.harbor</rfs-text>
<rfs-text font="mono" size="13" x="28" y="354" ls="1.1" fill="{mute}">PASSWORD</rfs-text>
<rfs-text font="mono" size="23" x="28" y="383" fill="{text}">Lantern-Fig-Orbit-Crane-47</rfs-text>
<!-- the one action -->
<rect y="404" width="528" height="44" fill="{raised}"/><rect y="404" width="528" height="1.5" fill="{line}"/>
<rfs-text font="sans" size="16" x="28" y="431.5" fill="{mute}">Generated in your browser.</rfs-text>
<rect x="352" y="411" width="152" height="30" rx="6" fill="{ember}"/>
<rfs-text font="mono-semibold" size="16" x="428" y="431.5" anchor="middle" fill="{on-ember}">New identity</rfs-text>
