name        = "identity-gen"
description = "Offline generator for throwaway signup identities"

[panel]
kind   = "flow"
status = ["ok generated locally in browser"]

[panel.input]
label = "Signup Form"
note  = "zero network"
chips = ["name", "handle", "email"]
